name: Check for Updates

on:
  schedule:
    # Run every 12 hours
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/check-versions.yml'
      - 'check_versions.sh'

permissions:
  contents: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Configure git
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
    
    - name: Check for new commits
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        chmod +x check_versions.sh
        # Auto-commits and pushes if changes detected. Success = no change
        # or update applied; a nonzero exit is a real error.
        ./check_versions.sh --update